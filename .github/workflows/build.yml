name: Build

# A compile gate, not a release build.
#
# The point is that a change to ApiSystem.cpp or GuiMenu.cpp is checked by
# something before it reaches a five-hour distribution build. Without this the
# first thing that ever compiles the fork is the image build, which is a poor
# place to discover a missing brace.
#
# aarch64 only, natively on a GitHub-hosted arm runner: no cross-compile and no
# QEMU. It is the only architecture this fork targets, so it is the only one
# worth spending a runner on.
#
# CMAKE_POLICY_VERSION_MINIMUM below is for external/id3v2lib, which asks for
# cmake_minimum_required(VERSION 3.1...3.22). CMake 4, which 26.04 ships,
# refuses anything under 3.5. The distribution passes the same flag to
# dolphin-sa for the same reason.
#
# The flags match projects/PortareOS/packages/ui/emulationstation/package.mk,
# so the code paths compiled here are the ones that ship. Changing them there
# without changing them here means CI stops covering what we build.
#
# The same applies to library versions, and used not to. apt ships older
# pipewire and mpv than the distribution pins, their headers differ, and a
# green run here once shipped a build failure into the image: spa/pod/iter.h
# arrived transitively on 1.0.x and stopped on 1.6.x. Those two headers are
# now taken from the pinned versions instead. SDL and the rest are still
# apt's, so this narrows the gap rather than closing it.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: aarch64
    # 26.04 for its compiler, not its packages: its default gcc is 15.2.0,
    # which is exactly what projects/PortareOS/packages/lang/gcc builds for
    # the image. 24.04 stops at 14.2.0, so until now the gate compiled with a
    # different major version than the thing it was gating.
    #
    # The image is marked preview by GitHub. If a run fails for something that
    # has nothing to do with this repository, that is the first thing to
    # suspect, and ubuntu-24.04-arm is the way back.
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The versions the distribution pins, in
      # projects/PortareOS/packages/. apt ships older ones, and their headers
      # differ: spa/pod/iter.h reached us transitively on 1.0.x and stopped on
      # 1.6.x, which is how a green run here shipped a build failure into the
      # image. Bump these when the recipes there move.
      - name: Pinned header versions
        run: |
          echo "PIPEWIRE_VERSION=1.6.8" >> "${GITHUB_ENV}"
          echo "MPV_VERSION=0.41.0" >> "${GITHUB_ENV}"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libsdl2-dev libsdl2-mixer-dev \
            libfreeimage-dev libfreetype-dev \
            libcurl4-openssl-dev rapidjson-dev \
            libgl1-mesa-dev libgles-dev \
            libmpv-dev libpipewire-0.3-dev \
            libpugixml-dev libudev-dev

      # ccache because a full build is thousands of files and most pushes touch
      # a handful. The key rotates per run so each build starts from the newest
      # cache and writes its own; restore-keys is what actually reuses it.
      # Headers only, laid over the ones apt installed. Linking still uses
      # apt's libraries, which is sound because the functions this frontend
      # calls are stable across these ranges; what is not stable, and what
      # this covers, is which header declares them.
      #
      # This does not make the run equivalent to an image build. SDL and the
      # rest are still apt's. It closes the two that move fastest and that we
      # call newest.
      - name: Fetch pinned pipewire and mpv headers
        run: |
          mkdir -p "${RUNNER_TEMP}/pinned"
          cd "${RUNNER_TEMP}/pinned"

          curl -sSL "https://github.com/PipeWire/pipewire/archive/${PIPEWIRE_VERSION}.tar.gz" | tar xz
          curl -sSL "https://github.com/mpv-player/mpv/archive/v${MPV_VERSION}.tar.gz" | tar xz

          PW="${RUNNER_TEMP}/pinned/pipewire-${PIPEWIRE_VERSION}"
          MPV="${RUNNER_TEMP}/pinned/mpv-${MPV_VERSION}"
          PREFIX="${RUNNER_TEMP}/pinned/prefix"

          # Fail here rather than three thousand files into the build if a
          # tarball ever moves its headers.
          test -f "${PW}/src/pipewire/pipewire.h"
          test -f "${PW}/src/pipewire/extensions/metadata.h"
          test -f "${PW}/spa/include/spa/pod/iter.h"
          test -f "${MPV}/include/mpv/client.h"
          test -f "${MPV}/include/mpv/render.h"

          mkdir -p "${PREFIX}/include" "${PREFIX}/lib/pkgconfig"
          cp -r "${PW}/src/pipewire"      "${PREFIX}/include/"
          cp -r "${PW}/spa/include/spa"   "${PREFIX}/include/"
          cp -r "${MPV}/include/mpv"      "${PREFIX}/include/"

          # version.h is generated by meson at build time, and pipewire.h
          # includes it, so the tarball alone does not compile.
          IFS=. read -r PW_MAJ PW_MIN PW_MIC <<< "${PIPEWIRE_VERSION}"
          sed -e "s/@PIPEWIRE_VERSION_MAJOR@/${PW_MAJ}/g" \
              -e "s/@PIPEWIRE_VERSION_MINOR@/${PW_MIN}/g" \
              -e "s/@PIPEWIRE_VERSION_MICRO@/${PW_MIC}/g" \
              -e "s/@PIPEWIRE_API_VERSION@/\"0.3\"/g" \
              "${PW}/src/pipewire/version.h.in" > "${PREFIX}/include/pipewire/version.h"
          rm -f "${PREFIX}/include/pipewire/version.h.in"
          grep -q "define PW_MAJOR ${PW_MAJ}" "${PREFIX}/include/pipewire/version.h"

          # pkg-config, not compiler flags. cmake emits <INCLUDES> before
          # <FLAGS>, so anything added through CMAKE_CXX_FLAGS lands after the
          # -I that pkg-config already gave it for apt's headers and never
          # wins. Overriding the .pc files is what the Find modules actually
          # read. Libs still point at apt's runtime, which holds because the
          # functions called here are stable across these ranges.
          cat > "${PREFIX}/lib/pkgconfig/libpipewire-0.3.pc" <<EOF
          Name: libpipewire
          Description: pinned headers, apt runtime
          Version: ${PIPEWIRE_VERSION}
          Cflags: -I${PREFIX}/include
          Libs: -lpipewire-0.3
          EOF
          cat > "${PREFIX}/lib/pkgconfig/mpv.pc" <<EOF
          Name: mpv
          Description: pinned headers, apt runtime
          Version: ${MPV_VERSION}
          Cflags: -I${PREFIX}/include
          Libs: -lmpv
          EOF
          sed -i 's/^ *//' "${PREFIX}/lib/pkgconfig/"*.pc

          echo "PKG_CONFIG_PATH=${PREFIX}/lib/pkgconfig" >> "${GITHUB_ENV}"
          echo "PINNED_PREFIX=${PREFIX}" >> "${GITHUB_ENV}"

          pkg-config --cflags libpipewire-0.3
          pkg-config --modversion libpipewire-0.3 mpv

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: es-aarch64-${{ github.ref_name }}
          max-size: 500M

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${PINNED_PREFIX}" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DPORTAREOS=1 \
            -DDISABLE_KODI=1 \
            -DENABLE_FILEMANAGER=0 \
            -DCEC=0 \
            -DUSE_SYSTEM_PUGIXML=1 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DGLES3=1

      - name: Build
        run: cmake --build build -j"$(nproc)"

      # A build that produced no binary is a green tick that means nothing.
      #
      # Not under build/: CMakeLists.txt forces EXECUTABLE_OUTPUT_PATH to
      # CMAKE_CURRENT_SOURCE_DIR on non-Windows, so an out-of-source build
      # still drops the binary at the repository root.
      - name: Check the binary exists
        run: |
          BIN="$(find . -path ./.git -prune -o \
                        -name emulationstation -type f -perm -u+x -print | head -1)"
          if [ -z "${BIN}" ]; then
            echo "::error::the build produced no emulationstation binary"
            find . -path ./.git -prune -o -type f -perm -u+x -newer CMakeLists.txt -print | head -20
            exit 1
          fi
          ls -lh "${BIN}"
          file "${BIN}"
